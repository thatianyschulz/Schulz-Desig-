<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c12" />
      <stop offset="50%" stop-color="#14192b" />
      <stop offset="100%" stop-color="#0a0c14" />
    </linearGradient>
    <linearGradient id="magentaOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E024C3" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
    <linearGradient id="orangeYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFC700" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad2)" />

  <!-- Ambient Glow circles -->
  <circle cx="240" cy="220" r="180" fill="#E024C3" opacity="0.12" filter="url(#glow2)" />
  <circle cx="650" cy="380" r="160" fill="#FF7A00" opacity="0.1" filter="url(#glow2)" />

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="600" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="250" y1="0" x2="250" y2="600" />
    <line x1="350" y1="0" x2="350" y2="600" />
    <line x1="450" y1="0" x2="450" y2="600" />
    <line x1="550" y1="0" x2="550" y2="600" />
    <line x1="650" y1="0" x2="650" y2="600" />
    <line x1="750" y1="0" x2="750" y2="600" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
  </g>

  <!-- Left Side: Mobile Phone Device Mockup -->
  <g transform="translate(120, 60)">
    <!-- Phone Shadow -->
    <rect x="15" y="15" width="280" height="490" rx="36" fill="rgba(0,0,0,0.6)" filter="url(#glow2)" />

    <!-- Phone Frame -->
    <rect x="0" y="0" width="280" height="490" rx="36" fill="#1b1e2a" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
    <!-- Screen Inner -->
    <rect x="8" y="8" width="264" height="474" rx="30" fill="#0d1017" />

    <!-- Dynamic Island / Speaker -->
    <rect x="100" y="14" width="80" height="18" rx="9" fill="#000000" />

    <!-- App Header in Screen -->
    <rect x="20" y="44" width="140" height="14" rx="4" fill="#E024C3" opacity="0.9" />
    <rect x="20" y="64" width="80" height="8" rx="4" fill="#64748b" />
    <circle cx="240" cy="52" r="10" fill="#1e2433" />
    <path d="M 237 49 L 243 55 M 243 49 L 237 55" stroke="#E024C3" stroke-width="1.5" />

    <!-- Search & Filter Bar -->
    <rect x="20" y="86" width="180" height="34" rx="10" fill="#161b26" stroke="#252c3d" stroke-width="1" />
    <circle cx="36" cy="103" r="5" fill="none" stroke="#64748b" stroke-width="2" />
    <text x="50" y="106" font-family="sans-serif" font-size="9" fill="#94a3b8">Buscar Santos, SP...</text>
    <!-- Filter button -->
    <rect x="208" y="86" width="36" height="34" rx="10" fill="url(#magentaOrange)" />
    <path d="M 220 98 L 232 98 M 223 103 L 229 103 M 225 108 L 227 108" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Property Card 1 (Featured) -->
    <g transform="translate(20, 132)">
      <rect width="224" height="185" rx="14" fill="#151a27" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <!-- Property Photo Placeholder with architectural gradient -->
      <rect width="224" height="105" rx="14" fill="#1e2436" />
      <path d="M 20 85 L 70 35 L 120 75 L 170 30 L 224 80 L 224 105 L 0 105 Z" fill="#252d42" opacity="0.5" />
      <!-- Price Tag Pill -->
      <rect x="12" y="12" width="78" height="22" rx="11" fill="rgba(0,0,0,0.6)" />
      <text x="51" y="27" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFC700" text-anchor="middle">R$ 890.000</text>
      <!-- Heart Wishlist -->
      <circle cx="204" cy="23" r="11" fill="rgba(0,0,0,0.5)" />
      <path d="M 204 20 C 201 17 197 19 197 22 C 197 25 204 29 204 29 C 204 29 211 25 211 22 C 211 19 207 17 204 20 Z" fill="#E024C3" />

      <!-- Property Info -->
      <text x="14" y="126" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Apartamento Vista Mar</text>
      <text x="14" y="142" font-family="sans-serif" font-size="9" fill="#94a3b8">Gonzaga, Santos • 112m²</text>
      <!-- Specs row -->
      <g transform="translate(14, 155)">
        <text x="0" y="12" font-family="sans-serif" font-size="9" fill="#E024C3">🛏 3 Quartos</text>
        <text x="75" y="12" font-family="sans-serif" font-size="9" fill="#00D2FF">🚗 2 Vagas</text>
        <text x="145" y="12" font-family="sans-serif" font-size="9" fill="#FF7A00">⭐ 4.9 (18)</text>
      </g>
    </g>

    <!-- Property Card 2 (Partial/Carousel preview) -->
    <g transform="translate(20, 330)">
      <rect width="224" height="110" rx="14" fill="#151a27" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <rect width="224" height="60" rx="14" fill="#1b2130" />
      <text x="14" y="80" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Cobertura Duplex Boqueirão</text>
      <text x="14" y="96" font-family="sans-serif" font-size="9" fill="#FFC700">R$ 1.450.000 • 198m²</text>
    </g>
  </g>

  <!-- Right Side: Presentation Details & Methodology -->
  <g transform="translate(460, 100)">
    <!-- App Badge -->
    <rect width="160" height="26" rx="13" fill="rgba(224, 36, 195, 0.12)" stroke="#E024C3" stroke-width="1" />
    <text x="80" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#E024C3" text-anchor="middle">GONZAGA IMÓVEIS</text>

    <!-- Main Title -->
    <text x="0" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Redesign Imobiliário</text>
    <text x="0" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="bold" fill="url(#magentaOrange)">Double Diamond</text>

    <!-- Metric Card 1 -->
    <g transform="translate(0, 130)">
      <rect width="260" height="65" rx="12" fill="#141824" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <circle cx="32" cy="32" r="16" fill="rgba(224,36,195,0.15)" />
      <text x="32" y="37" font-family="sans-serif" font-size="14" font-weight="bold" fill="#E024C3" text-anchor="middle">◇◇</text>
      <text x="58" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Double Diamond</text>
      <text x="58" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Descoberta, Definição, Testes</text>
    </g>

    <!-- Metric Card 2 -->
    <g transform="translate(0, 210)">
      <rect width="260" height="65" rx="12" fill="#141824" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <circle cx="32" cy="32" r="16" fill="rgba(255,122,0,0.15)" />
      <text x="32" y="37" font-family="sans-serif" font-size="13" font-weight="bold" fill="#FF7A00" text-anchor="middle">+60%</text>
      <text x="58" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Facilidade de Busca</text>
      <text x="58" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Filtros dinâmicos e mapa intuitivo</text>
    </g>

    <!-- Metric Card 3 -->
    <g transform="translate(0, 290)">
      <rect width="260" height="65" rx="12" fill="#141824" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <circle cx="32" cy="32" r="16" fill="rgba(0,210,255,0.15)" />
      <path d="M 27 32 L 30 35 L 37 28" fill="none" stroke="#00D2FF" stroke-width="2" stroke-linecap="round" />
      <text x="58" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Protótipo no Figma</text>
      <text x="58" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Componentes e fluxos interativos</text>
    </g>
  </g>
</svg>
