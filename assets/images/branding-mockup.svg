<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="50%" stop-color="#141724" />
      <stop offset="100%" stop-color="#0a0c12" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF8F00" />
    </linearGradient>
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#7B2CBF" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad3)" />

  <!-- Ambient Glow circles -->
  <circle cx="260" cy="280" r="180" fill="#FFB300" opacity="0.08" filter="url(#glow3)" />
  <circle cx="600" cy="300" r="160" fill="#00D2FF" opacity="0.09" filter="url(#glow3)" />

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="600" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="250" y1="0" x2="250" y2="600" />
    <line x1="350" y1="0" x2="350" y2="600" />
    <line x1="450" y1="0" x2="450" y2="600" />
    <line x1="550" y1="0" x2="550" y2="600" />
    <line x1="650" y1="0" x2="650" y2="600" />
    <line x1="750" y1="0" x2="750" y2="600" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
  </g>

  <!-- Left Side: 3D Layered Business Cards -->
  <g transform="translate(60, 40)">
    <!-- Card 1: Dark Obsidian & Gold Foil (Advocacia & Consultoria) -->
    <g transform="translate(60, 160) rotate(-12)">
      <rect x="0" y="0" width="280" height="160" rx="12" fill="#12131a" stroke="rgba(255, 179, 0, 0.4)" stroke-width="1.5" filter="url(#glow3)" />
      <!-- Logo Symbol -->
      <polygon points="40,40 55,70 25,70" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
      <circle cx="40" cy="55" r="4" fill="url(#goldGrad)" />
      <!-- Text Lines -->
      <text x="75" y="50" font-family="'Plus Jakarta Sans', serif" font-size="14" font-weight="bold" fill="url(#goldGrad)" letter-spacing="2">LEX &amp; IURIS</text>
      <text x="75" y="66" font-family="sans-serif" font-size="8" fill="#94a3b8" letter-spacing="1">ADVOCACIA E CONSULTORIA</text>

      <line x1="30" y1="95" x2="250" y2="95" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="30" y="115" font-family="sans-serif" font-size="9" fill="#e2e8f0">Dra. Helena Valente</text>
      <text x="30" y="128" font-family="sans-serif" font-size="8" fill="#64748b">OAB/SP 412.890 • Direito Digital</text>
      <text x="30" y="142" font-family="sans-serif" font-size="8" fill="#94a3b8">contato@lexiuris.com.br</text>
    </g>

    <!-- Card 2: Minimalist Cyan Modern (Engenharia & Mecânica) -->
    <g transform="translate(100, 240) rotate(6)">
      <rect x="0" y="0" width="280" height="160" rx="12" fill="#0e1320" stroke="rgba(0, 210, 255, 0.5)" stroke-width="1.5" filter="url(#glow3)" />
      <circle cx="45" cy="52" r="14" fill="rgba(0,210,255,0.15)" stroke="#00D2FF" stroke-width="2" />
      <path d="M 45 42 L 45 62 M 35 52 L 55 52" stroke="#00D2FF" stroke-width="2" />
      <text x="72" y="48" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" letter-spacing="1">VORTEX</text>
      <text x="72" y="62" font-family="sans-serif" font-size="8" font-weight="600" fill="#00D2FF" letter-spacing="1.5">PRECISION LAB</text>

      <line x1="30" y1="95" x2="250" y2="95" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <text x="30" y="115" font-family="sans-serif" font-size="9" fill="#ffffff">Eng. Marcos Andrade</text>
      <text x="30" y="128" font-family="sans-serif" font-size="8" fill="#00D2FF">Engenharia Mecatrônica &amp; Protótipos</text>
      <text x="30" y="142" font-family="sans-serif" font-size="8" fill="#94a3b8">vortex-precision.io</text>
    </g>
  </g>

  <!-- Right Side: Details & Highlights -->
  <g transform="translate(460, 100)">
    <rect width="180" height="26" rx="13" fill="rgba(255, 179, 0, 0.12)" stroke="#FFB300" stroke-width="1" />
    <text x="90" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#FFB300" text-anchor="middle">BRANDING &amp; IDENTIDADE</text>

    <text x="0" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Identidades Visuais</text>
    <text x="0" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="bold" fill="url(#goldGrad)">Multi-Segmentos</text>

    <!-- Card 1 -->
    <g transform="translate(0, 130)">
      <rect width="260" height="65" rx="12" fill="#141824" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <circle cx="32" cy="32" r="16" fill="rgba(255,179,0,0.15)" />
      <text x="32" y="37" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFB300" text-anchor="middle">✦</text>
      <text x="58" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Marcas com Propósito</text>
      <text x="58" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Do conceito ao manual de aplicação</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(0, 210)">
      <rect width="260" height="65" rx="12" fill="#141824" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <circle cx="32" cy="32" r="16" fill="rgba(0,210,255,0.15)" />
      <text x="32" y="37" font-family="sans-serif" font-size="13" font-weight="bold" fill="#00D2FF" text-anchor="middle">CMYK</text>
      <text x="58" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Produção Gráfica</text>
      <text x="58" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Fechamento técnico para impressão</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(0, 290)">
      <rect width="260" height="65" rx="12" fill="#141824" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <circle cx="32" cy="32" r="16" fill="rgba(224,36,195,0.15)" />
      <text x="32" y="37" font-family="sans-serif" font-size="13" font-weight="bold" fill="#E024C3" text-anchor="middle">35%</text>
      <text x="58" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Reconhecimento</text>
      <text x="58" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Aumento de lembrança de marca</text>
    </g>
  </g>
</svg>
