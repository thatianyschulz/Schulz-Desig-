<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e17" />
      <stop offset="50%" stop-color="#121626" />
      <stop offset="100%" stop-color="#090a10" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#E024C3" />
      <stop offset="100%" stop-color="#FF7A00" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Ambient Glow circles -->
  <circle cx="200" cy="180" r="160" fill="#00D2FF" opacity="0.12" filter="url(#glow)" />
  <circle cx="620" cy="420" r="180" fill="#E024C3" opacity="0.1" filter="url(#glow)" />

  <!-- Subtle grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="600" />
    <line x1="150" y1="0" x2="150" y2="600" />
    <line x1="250" y1="0" x2="250" y2="600" />
    <line x1="350" y1="0" x2="350" y2="600" />
    <line x1="450" y1="0" x2="450" y2="600" />
    <line x1="550" y1="0" x2="550" y2="600" />
    <line x1="650" y1="0" x2="650" y2="600" />
    <line x1="750" y1="0" x2="750" y2="600" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
    <line x1="0" y1="500" x2="800" y2="500" />
  </g>

  <!-- Left Side: Mobile Phone Device Mockup -->
  <g transform="translate(120, 60)">
    <!-- Phone Shadow -->
    <rect x="15" y="15" width="280" height="490" rx="36" fill="rgba(0,0,0,0.6)" filter="url(#glow)" />

    <!-- Phone Frame -->
    <rect x="0" y="0" width="280" height="490" rx="36" fill="#1b1e2a" stroke="rgba(255,255,255,0.15)" stroke-width="2" />
    <!-- Screen Inner -->
    <rect x="8" y="8" width="264" height="474" rx="30" fill="#0d1017" />

    <!-- Dynamic Island / Speaker -->
    <rect x="100" y="14" width="80" height="18" rx="9" fill="#000000" />

    <!-- App Header in Screen -->
    <rect x="20" y="44" width="130" height="14" rx="4" fill="#00D2FF" opacity="0.9" />
    <rect x="20" y="64" width="90" height="8" rx="4" fill="#64748b" />
    <!-- Notification Bell -->
    <circle cx="240" cy="52" r="10" fill="#1e2433" />
    <circle cx="244" cy="48" r="3" fill="#00D2FF" />

    <!-- Search Bar in Screen -->
    <rect x="20" y="86" width="240" height="34" rx="10" fill="#161b26" stroke="#252c3d" stroke-width="1" />
    <circle cx="36" cy="103" r="5" fill="none" stroke="#64748b" stroke-width="2" />
    <rect x="50" y="100" width="120" height="6" rx="3" fill="#475569" />

    <!-- Simulated Map Area -->
    <rect x="20" y="132" width="240" height="220" rx="14" fill="#141824" stroke="rgba(0, 210, 255, 0.2)" stroke-width="1" />

    <!-- Map Roads -->
    <path d="M 20 180 Q 90 200 160 170 T 260 210" fill="none" stroke="#1f2638" stroke-width="10" />
    <path d="M 80 132 L 110 352" fill="none" stroke="#1f2638" stroke-width="8" />
    <path d="M 190 132 Q 170 240 210 352" fill="none" stroke="#1f2638" stroke-width="10" />
    <path d="M 40 280 L 260 270" fill="none" stroke="#1f2638" stroke-width="12" />

    <!-- User Location Pin -->
    <circle cx="110" cy="220" r="14" fill="rgba(0, 210, 255, 0.25)" />
    <circle cx="110" cy="220" r="7" fill="#00D2FF" stroke="#ffffff" stroke-width="2" />

    <!-- Parking Pins (Green/Cyan Available, Magenta Busy) -->
    <!-- Pin 1 Available -->
    <g transform="translate(170, 165)">
      <rect x="-16" y="-12" width="32" height="20" rx="6" fill="#00D2FF" />
      <text x="0" y="2" font-family="sans-serif" font-size="9" font-weight="bold" fill="#000" text-anchor="middle">5 v</text>
    </g>

    <!-- Pin 2 Available -->
    <g transform="translate(70, 270)">
      <rect x="-16" y="-12" width="32" height="20" rx="6" fill="#10b981" />
      <text x="0" y="2" font-family="sans-serif" font-size="9" font-weight="bold" fill="#000" text-anchor="middle">12 v</text>
    </g>

    <!-- Pin 3 Low -->
    <g transform="translate(200, 290)">
      <rect x="-16" y="-12" width="32" height="20" rx="6" fill="#FF7A00" />
      <text x="0" y="2" font-family="sans-serif" font-size="9" font-weight="bold" fill="#000" text-anchor="middle">1 v</text>
    </g>

    <!-- Bottom Floating Sheet (Card de Vaga Selecionada) -->
    <g transform="translate(20, 362)">
      <rect width="240" height="96" rx="12" fill="#1a202c" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
      <!-- Spot Icon / Indicator -->
      <circle cx="30" cy="30" r="14" fill="rgba(0,210,255,0.15)" />
      <text x="30" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#00D2FF" text-anchor="middle">P</text>
      <!-- Title -->
      <rect x="52" y="20" width="100" height="8" rx="4" fill="#ffffff" />
      <rect x="52" y="32" width="70" height="6" rx="3" fill="#94a3b8" />
      <!-- Availability pill -->
      <rect x="175" y="18" width="52" height="18" rx="9" fill="rgba(16,185,129,0.2)" />
      <text x="201" y="30" font-family="sans-serif" font-size="8" font-weight="bold" fill="#34d399" text-anchor="middle">LIVRE</text>
      <!-- Action CTA Button -->
      <rect x="12" y="58" width="216" height="28" rx="8" fill="url(#cyanBlue)" />
      <text x="120" y="76" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">RESERVAR VAGA AGORA</text>
    </g>
  </g>

  <!-- Right Side: Feature Presentation Cards -->
  <g transform="translate(460, 100)">
    <!-- App Badge -->
    <rect width="130" height="26" rx="13" fill="rgba(0, 210, 255, 0.12)" stroke="#00D2FF" stroke-width="1" />
    <text x="65" y="17" font-family="sans-serif" font-size="11" font-weight="600" fill="#00D2FF" text-anchor="middle">VAGATION APP</text>

    <!-- Main Title -->
    <text x="0" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Vagas Urbanas</text>
    <text x="0" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="bold" fill="#00D2FF">em Tempo Real</text>

    <!-- Metric Card 1 -->
    <g transform="translate(0, 130)">
      <rect width="260" height="65" rx="12" fill="#141824" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <circle cx="32" cy="32" r="16" fill="rgba(0,210,255,0.15)" />
      <path d="M 27 32 L 30 35 L 37 28" fill="none" stroke="#00D2FF" stroke-width="2" stroke-linecap="round" />
      <text x="58" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">UX Colaborativo</text>
      <text x="58" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Motoristas e comércios conectados</text>
    </g>

    <!-- Metric Card 2 -->
    <g transform="translate(0, 210)">
      <rect width="260" height="65" rx="12" fill="#141824" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <circle cx="32" cy="32" r="16" fill="rgba(224,36,195,0.15)" />
      <text x="32" y="37" font-family="sans-serif" font-size="13" font-weight="bold" fill="#E024C3" text-anchor="middle">-45%</text>
      <text x="58" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Tempo de Busca</text>
      <text x="58" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Redução de tempo no trânsito</text>
    </g>

    <!-- Metric Card 3 -->
    <g transform="translate(0, 290)">
      <rect width="260" height="65" rx="12" fill="#141824" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <circle cx="32" cy="32" r="16" fill="rgba(255,122,0,0.15)" />
      <text x="32" y="37" font-family="sans-serif" font-size="12" font-weight="bold" fill="#FF7A00" text-anchor="middle">FIG</text>
      <text x="58" y="28" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Protótipo Interativo</text>
      <text x="58" y="46" font-family="sans-serif" font-size="10" fill="#94a3b8">Testado e validado no Figma</text>
    </g>
  </g>
</svg>
